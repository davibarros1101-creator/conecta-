<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conecta+</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img src="icons/icon-48.png" alt="">
    <div>
      <strong>Conecta+</strong>
      <span>Pessoas reais. Conexões seguras.</span>
    </div>
  </header>

  <button type="button" class="verify-link" data-abrir-verificar>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
    Verificar um print/mensagem suspeita
  </button>

  <button type="button" class="verify-link" data-abrir-verificar-rosto>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    Verificar rosto numa videochamada
  </button>

  <div class="progress">
    <div class="progress__bar"><div class="progress__fill" data-progress-fill style="width:0%"></div></div>
    <span data-progress-label>1 de 40</span>
  </div>

  <main data-app></main>

  <script src="scenarios.js"></script>
  <script src="popup.js"></script>
</body>
</html>
